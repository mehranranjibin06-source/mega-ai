<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ترمینال MehranAiShabestar</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; height:100%; background:#07090c; color:#d7e3ea;
    font-family: "Consolas", "Courier New", monospace; font-size:15px; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  header { background:#0d1218; border-bottom:1px solid #1d2833; padding:10px 14px;
    display:flex; align-items:center; gap:10px; font-size:14px; }
  header b { color:#f0c76a; letter-spacing:.5px; }
  header .dot { width:8px; height:8px; border-radius:50%; background:#39d353; box-shadow:0 0 8px #39d353; }
  header .sp { flex:1 }
  header a { color:#6fb1ff; text-decoration:none; font-size:13px; }
  #out { flex:1; overflow-y:auto; padding:14px 14px 8px; line-height:1.75; }
  .line { white-space:pre-wrap; word-break:break-word; margin:2px 0; }
  .dim { color:#6b7c8c }
  .ok { color:#39d353 } .warn { color:#ffb454 } .err { color:#ff6b6b }
  .tool { color:#8ab4f8 } .art { color:#f0c76a } .ai { color:#e8f0f5 }
  .box { border:1px solid #1d2833; border-radius:8px; padding:8px 10px; margin:8px 0;
    background:#0b1016 }
  #bar { border-top:1px solid #1d2833; background:#0d1218; padding:10px 12px;
    display:flex; gap:8px; align-items:center; }
  #p { color:#39d353; }
  #in { flex:1; background:transparent; border:0; outline:0; color:#e8f0f5;
    font-family:inherit; font-size:15px; }
  #go { background:#1f6feb; border:0; color:#fff; border-radius:8px; padding:9px 16px;
    font-family:inherit; font-size:14px; }
  #go:disabled { opacity:.5 }
  .cur::after { content:"▋"; animation:bl 1s steps(1) infinite; color:#39d353 }
  @keyframes bl { 50% { opacity:0 } }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <span class="dot"></span>
    <b>MehranAiShabestar</b>
    <span class="dim">— ترمینال کارگزار</span>
    <span class="sp"></span>
    <a href="/tv">📺 تلویزیون</a>
    <a href="/more" style="text-decoration:none;margin-inline-start:6px"><button type="button">✨ افزودنی‌ها</button></a>
    <a href="/guide">🔑 گرفتن کلید</a>
    <a href="/">پنل کامل</a>
  </header>
  <div id="out"></div>
  <div id="keyrow" style="display:none; border-top:1px solid #1d2833; background:#0b1016; padding:10px 12px">
    <div class="dim" style="font-size:13px; margin-bottom:6px">
      کلید هوش را همین‌جا پیست کن (از avalai.ir یا gapgpt.app — راهنما: <a href="/guide" style="color:#6fb1ff">اینجا</a>)
    </div>
    <div style="display:flex; gap:8px">
      <input id="ky" placeholder="کلید رایگان را بچسبان (Cloudflare / Groq / OpenRouter / AvalAI)" style="flex:1; background:#07090c; border:1px solid #24313d; color:#e8f0f5; border-radius:8px; padding:10px; font-family:inherit; direction:ltr">
      <button id="ks" style="background:#1f6feb;border:0;color:#fff;border-radius:8px;padding:10px 16px;font-family:inherit">ذخیره</button>
    </div>
    <div id="km" class="dim" style="font-size:13px; margin-top:6px"></div>
  </div>
  <div id="bar">
    <span id="p">$</span>
    <input id="in" placeholder="کارت را به فارسی بنویس… مثلاً: یک پوستر تبلیغاتی برای کافه بساز" autocomplete="off">
    <button id="go">اجرا</button>
  </div>
</div>
<script>
const out = document.getElementById('out'), inp = document.getElementById('in'),
      go = document.getElementById('go');
let busy = false, cur = null;

function L(cls, txt) {
  const d = document.createElement('div');
  d.className = 'line ' + (cls || '');
  d.textContent = txt;
  out.appendChild(d); out.scrollTop = out.scrollHeight;
  return d;
}
function stream(text) {                    // متن تازه‌تازه (مثل تایپ)
  if (!cur) { cur = L('ai cur', ''); }
  cur.textContent += text;
  out.scrollTop = out.scrollHeight;
}
function endStream() { if (cur) { cur.classList.remove('cur'); cur = null; } }

async function run(goal) {
  if (busy || !goal.trim()) return;
  busy = true; go.disabled = true; inp.disabled = true;
  L('dim', '$ ' + goal);
  L('dim', '… در حال کار (ممکن است چند دقیقه طول بکشد)');
  try {
    const r = await fetch('/api/agent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ goal, mode: 'agent' })
    });
    if (r.status === 401) { L('err', 'رمز اشتباه است — صفحه را رفرش کن و رمز را بزن.'); return; }
    if (!r.ok || !r.body) { L('err', 'خطا: ' + r.status); return; }
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await rd.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const parts = buf.split('\n\n'); buf = parts.pop();
      for (const p of parts) {
        const line = p.split('\n').find(x => x.startsWith('data:'));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5).trim()); } catch { continue; }
        handle(ev);
      }
    }
  } catch (e) {
    L('err', 'قطع شد: ' + e.message);
  } finally {
    endStream(); busy = false; go.disabled = false; inp.disabled = false; inp.focus();
  }
}

function stripTools(t){
  return (t||"").replace(/```(?:tool|tool_call)[\s\S]*?(?:```|$)/g, "").replace(/\n{3,}/g,"\n\n").replace(/^\s+/,"");
}

function handle(ev) {
  switch (ev.type) {
    case 'session': break;
    case 'meta':   L('dim', '📁 پوشه کار: ' + (ev.dir || '—')); break;
    case 'model':  L('ok', '🧠 مدل: ' + ev.name + '  (' + ev.provider + ')'); break;
    case 'phase':  L('dim', (ev.state === 'done' ? '✓ ' : '▶ ') + (ev.title || ev.id)); break;
    case 'plan':
      if (ev.plan && ev.plan.steps && ev.plan.steps.length) {
        L('dim', '— نقشه کار:');
        ev.plan.steps.forEach((s, i) => L('dim', '   ' + (i + 1) + ') ' + (s.title || s.goal || s)));
      }
      break;
    case 'delta':   stream(stripTools(ev.text || '')); break;
    case 'thought': endStream(); if (ev.text) L('ai', ev.text); break;
    case 'step':
      endStream();
      if (ev.state === 'start') L('dim', '— گام ' + ev.n + ' …');
      if (ev.state === 'failed') L('err', '✗ گام ' + ev.n + ': ' + (ev.error || 'خطا'));
      if (ev.state === 'done' && ev.text) L('ai', ev.text);
      break;
    case 'tool':        L('tool', '🔧 ' + ev.name + '  ' + JSON.stringify(ev.args || ev.input || {}).slice(0, 160)); break;
    case 'tool_result': L('dim', '↳ ' + String(ev.result || '').slice(0, 300).replace(/\n/g, ' ')); break;
    case 'artifact':    L('art', '📦 ساخته شد: ' + ev.name + (ev.path ? '  (' + ev.path + ')' : '')); break;
    case 'error':       L('err', '✗ ' + ev.message); break;
    case 'final':       endStream(); if (ev.text) L('ok', '✅ ' + ev.text); break;
    case 'end':         endStream(); L('dim', '—'); break;
  }
}

document.getElementById('ks').onclick = async () => {
  const k = document.getElementById('ky').value.trim();
  const m = document.getElementById('km');
  if (!k) { m.textContent = 'کلید خالی است'; return; }
  m.textContent = '… در حال تست کلید';
  // سرور خودش نوع کلید را می‌فهمد؛ اگر توکن و شناسهٔ حساب را با فاصله پشت‌سرهم بچسبانی هر دو ذخیره می‌شوند
  const body = { key: k };
  try {
    const r = await fetch('/api/keys', { method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    m.textContent = d.message || (d.ok ? 'ذخیره شد' : 'خطا');
    m.style.color = (d.message || '').startsWith('✅') ? '#39d353' : '#ffb454';
    if ((d.message || '').startsWith('✅')) { L('ok', d.message); document.getElementById('keyrow').style.display='none'; }
  } catch (e) { m.textContent = 'خطا: ' + e.message; }
};
if (location.hash === '#key' || !localStorage.getItem('mega_key_seen')) {
  document.getElementById('keyrow').style.display = 'block';
  localStorage.setItem('mega_key_seen', '1');
}
go.onclick = () => { const g = inp.value; inp.value = ''; run(g); };
inp.addEventListener('keydown', e => { if (e.key === 'Enter') { const g = inp.value; inp.value = ''; run(g); } });
L('dim', 'ترمینال ابرهوش — هر کاری که بنویسی، انجامش می‌دهد: کد می‌نویسد و اجرا می‌کند، فایل تحلیل می‌کند، عکس و ویدیو می‌سازد.');
L('dim', 'برای شروع یک کلید API در پنل ثبت کن (بخش کلیدها)، بعد بنویس: «یک اسکریپت بنویس که ...»');
inp.focus();
</script>
</body>
</html>
