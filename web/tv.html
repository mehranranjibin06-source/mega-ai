<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📺 تلویزیون — MehranAiShabestar</title>
<style>
  :root{--bg:#070a14;--card:#0e1424;--line:#1e2740;--txt:#e8eef7;--dim:#8ea0bd;--acc:#7c5cff;--acc2:#22d3ee}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#16204a 0%,var(--bg) 60%);color:var(--txt);
       font-family:Vazirmatn,system-ui,Tahoma,sans-serif;padding:14px}
  .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .brand{font-weight:800;font-size:18px;display:flex;gap:8px;align-items:center}
  .pill{background:#12203a;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:4px 10px;font-size:12px}
  a.btn,button{font-family:inherit;cursor:pointer}
  .btn{background:#121a2e;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;text-decoration:none;font-size:14px}
  .btn.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff}
  input[type=search]{flex:1;min-width:180px;background:#0b1120;border:1px solid var(--line);color:var(--txt);
       border-radius:10px;padding:10px 12px;font-family:inherit}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .ch{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:10px;
      align-items:center;cursor:pointer;transition:.15s}
  .ch:hover{border-color:var(--acc);transform:translateY(-2px)}
  .ch img{width:44px;height:44px;object-fit:contain;border-radius:8px;background:#0a0f1c}
  .ch .nm{font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ch .gp{color:var(--dim);font-size:11px}
  .modal{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:10px;z-index:50}
  .modal.on{display:flex}
  .player{width:100%;max-width:960px;background:#0b1020;border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .player .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  video{width:100%;background:#000;display:block;aspect-ratio:16/9}
  .hint{color:var(--dim);font-size:12px;margin:10px 2px}
  .empty{color:var(--dim);text-align:center;padding:40px 0}
</style>
</head>
<body>
<div class="top">
  <div class="brand">📺 تلویزیون <span class="pill">رایگان • بدون اشتراک</span></div>
  <a class="btn" href="/">🏠 خانه</a>
  <a class="btn" href="/terminal">🤖 کارگزار</a>
  <button class="btn" id="refresh">🔄 بروزرسانی فهرست</button>
</div>

<div class="top">
  <button class="btn on" data-c="">همه</button>
  <button class="btn" data-c="ir">🇮🇷 ایران</button>
  <button class="btn" data-c="az">🇦🇿 آذربایجان</button>
  <button class="btn" data-c="tr">🇹🇷 ترکیه</button>
  <input type="search" id="q" placeholder="جست‌وجوی کانال… مثلاً IRIB، TRT، خبر">
</div>

<div class="hint" id="stat">در حال گرفتن فهرست کانال‌ها…</div>
<div class="grid" id="list"></div>

<div class="modal" id="modal">
  <div class="player">
    <div class="hd">
      <b id="ptitle">—</b>
      <span>
        <a class="btn" id="popen" href="#" target="_blank" rel="noopener">باز کردن جدا</a>
        <button class="btn" id="pclose">بستن ✕</button>
      </span>
    </div>
    <video id="pvid" controls autoplay playsinline></video>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<script>
let ALL=[], COUNTRY="", Q="", HLS=null;
const $=s=>document.querySelector(s);

async function load(force){
  $("#stat").textContent="در حال گرفتن فهرست کانال‌ها…";
  try{
    const d=await (await fetch("/api/tv"+(force?"?refresh=1":""))).json();
    ALL=d.items||[];
    $("#stat").textContent=`${ALL.length} کانال آزاد — ${ALL.filter(c=>c.country==="ir").length} ایرانی، `+
      `${ALL.filter(c=>c.country==="az").length} آذربایجانی، ${ALL.filter(c=>c.country==="tr").length} ترکی`;
    render();
  }catch(e){ $("#stat").textContent="فهرست گرفته نشد — اینترنت سرور را چک کن."; }
}
function render(){
  const q=Q.trim().toLowerCase();
  const items=ALL.filter(c=>(!COUNTRY||c.country===COUNTRY) &&
    (!q || c.name.toLowerCase().includes(q) || (c.group||"").toLowerCase().includes(q))).slice(0,600);
  $("#list").innerHTML = items.length? items.map((c,i)=>`
    <div class="ch" onclick='play(${JSON.stringify(c.name)}, ${JSON.stringify(c.url)})'>
      ${c.logo?`<img src="${c.logo}" onerror="this.style.display='none'">`:"<div style='width:44px;height:44px;border-radius:8px;background:#0a0f1c'></div>"}
      <div><div class="nm">${c.name}</div><div class="gp">${c.group||""} · ${c.country_label||""}</div></div>
    </div>`).join("") : `<div class="empty">کانالی پیدا نشد</div>`;
}
function play(name,url){
  $("#ptitle").textContent=name; $("#popen").href=url;
  $("#modal").classList.add("on");
  const v=$("#pvid");
  if(HLS){ HLS.destroy(); HLS=null; }
  if(window.Hls && Hls.isSupported()){ HLS=new Hls({lowLatencyMode:false}); HLS.loadSource(url); HLS.attachMedia(v); HLS.on(Hls.Events.ERROR,()=>{}); }
  else { v.src=url; }
  v.play().catch(()=>{});
}
$("#pclose").onclick=()=>{ $("#modal").classList.remove("on"); const v=$("#pvid"); v.pause(); v.removeAttribute("src"); };
document.querySelectorAll("[data-c]").forEach(b=> b.onclick=()=>{
  COUNTRY=b.dataset.c; document.querySelectorAll("[data-c]").forEach(x=>x.classList.remove("on")); b.classList.add("on"); render();
});
$("#q").oninput=e=>{ Q=e.target.value; render(); };
$("#refresh").onclick=()=>load(true);
load(false);
</script>
</body>
</html>
