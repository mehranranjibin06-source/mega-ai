<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>افزودنی‌ها — MehranAiShabestar</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root{--bg:#080c1a;--bg2:#101731;--card:#141c38;--card2:#1b2448;--line:#26305a;
        --txt:#e9edff;--dim:#98a3cf;--accent:#7c5cff;--accent2:#22d3ee;--ok:#34d399;--err:#f87171}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1100px 600px at 90% -10%,#1d2750 0,#080c1a 55%);
       background-color:#080c1a;color:var(--txt);font-family:Vazirmatn,Segoe UI,Tahoma,system-ui,sans-serif;font-size:15px}
  a{color:var(--accent2);text-decoration:none}
  header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:20;backdrop-filter:blur(12px);background:#080c1aee;flex-wrap:wrap}
  .brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
  .grow{flex:1}
  .chip{border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--txt)}
  .chip.on{background:linear-gradient(135deg,var(--accent),#4f46e5);border-color:transparent;font-weight:700}
  .chip:hover{border-color:var(--accent)}
  main{padding:16px;max-width:1200px;margin:auto}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px 15px;font-size:14px;cursor:pointer;color:var(--txt)}
  .tab.on{background:linear-gradient(135deg,#7c5cff,#4f46e5);border-color:transparent;font-weight:800;box-shadow:0 8px 22px #7c5cff55}
  .panel{display:none}
  .panel.on{display:block}
  .card{background:linear-gradient(165deg,#161f42,#111936);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:15px;color:var(--dim);font-weight:600}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--bg2);
        border:1px solid var(--line);border-radius:12px;padding:10px}
  input,select{min-width:0}
  textarea{width:100%;min-height:130px;line-height:1.9;resize:vertical}
  button{font-family:inherit;font-size:14px;color:var(--txt);background:var(--card2);border:1px solid var(--line);
        border-radius:12px;padding:9px 15px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);transform:translateY(-1px)}
  button.primary{background:linear-gradient(135deg,var(--accent),#4f46e5);border:0;font-weight:700}
  .hint{font-size:12px;color:var(--dim);line-height:1.9}
  /* هوا */
  .now{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
  .now .big{font-size:54px;line-height:1}
  .now .t{font-size:40px;font-weight:800}
  .days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-top:14px}
  .day{background:#0e1531;border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center}
  .day b{display:block;font-size:13px;color:var(--dim);font-weight:600;margin-bottom:5px}
  /* رادیو */
  .stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:9px;max-height:60vh;overflow:auto;padding-inline-end:4px}
  .st{display:flex;gap:9px;align-items:center;background:#0e1531;border:1px solid var(--line);border-radius:14px;padding:9px 11px}
  .st img{width:34px;height:34px;border-radius:9px;object-fit:cover;background:#1b2448}
  .st .nm{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st .tg{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .st button{padding:6px 11px;border-radius:10px}
  .st.playing{border-color:var(--ok);box-shadow:0 0 0 1px #34d39955}
  /* اخبار */
  .news{display:flex;flex-direction:column;gap:8px}
  .nw{background:#0e1531;border:1px solid var(--line);border-radius:14px;padding:11px 13px}
  .nw .tt{font-size:14.5px;line-height:1.8}
  .nw .mt{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
  .badge{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--dim)}
  .badge.ok{border-color:#1f7a5a;color:var(--ok)}
  .badge.no{border-color:#7a2f2f;color:var(--err)}
  /* مترجم */
  .tr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:760px){.tr{grid-template-columns:1fr}}
  .out{background:#080d1f;border:1px solid var(--line);border-radius:14px;padding:12px;min-height:130px;line-height:2;font-size:15px}
  footer{color:var(--dim);font-size:12px;text-align:center;padding:18px}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid #ffffff44;border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="brand">✨ <span>افزودنی‌های ابرهوش</span></div>
  <div class="grow"></div>
  <a class="chip" href="/advanced">🏠 داشبورد</a>
  <a class="chip" href="/tv">📺 تلویزیون</a>
  <a class="chip" href="/terminal">🖥 ترمینال</a>
</header>

<main>
  <div class="tabs">
    <div class="tab on" data-p="weather">🌦 آب‌وهوا</div>
    <div class="tab" data-p="radio">📻 رادیو</div>
    <div class="tab" data-p="news">📰 اخبار</div>
    <div class="tab" data-p="translate">🌐 مترجم</div>
  </div>

  <!-- ═══ هوا ═══ -->
  <section id="p-weather" class="panel on">
    <div class="card">
      <div class="row">
        <input id="wCity" placeholder="نام شهر (مثلاً تبریز یا Shabestar)" value="تبریز" style="flex:1;min-width:180px">
        <button class="primary" id="wGo">🔍 نمایش هوا</button>
      </div>
      <div class="row" style="margin-top:9px">
        <button class="chip" data-city="تبریز">تبریز</button>
        <button class="chip" data-city="شبستر">شبستر</button>
        <button class="chip" data-city="تهران">تهران</button>
        <button class="chip" data-city="ارومیه">ارومیه</button>
        <button class="chip" data-city="استانبول">استانبول</button>
        <button class="chip" data-city="باکو">باکو</button>
      </div>
      <div class="hint" id="wStatus" style="margin-top:8px"></div>
    </div>
    <div class="card" id="wBox" style="display:none"></div>
  </section>

  <!-- ═══ رادیو ═══ -->
  <section id="p-radio" class="panel">
    <div class="card">
      <div class="row">
        <span class="chip on" data-cc="">همه</span>
        <span class="chip" data-cc="IR">🇮🇷 ایران</span>
        <span class="chip" data-cc="AZ">🇦🇿 آذربایجان</span>
        <span class="chip" data-cc="TR">🇹🇷 ترکیه</span>
        <input id="rQ" placeholder="جست‌وجوی نام ایستگاه" style="flex:1;min-width:150px">
        <button id="rGo">🔍</button>
        <button id="rRe">🔄</button>
      </div>
      <div class="hint" id="rStatus" style="margin-top:8px"></div>
    </div>
    <div class="card"><div class="stations" id="rList"></div></div>
  </section>

  <!-- ═══ اخبار ═══ -->
  <section id="p-news" class="panel">
    <div class="card">
      <div class="row">
        <span class="hint">تیترهای تازه از خبرگزاری‌های فارسی — هر منبعی که در دسترس باشد.</span>
        <div class="grow"></div>
        <button id="nRe">🔄 به‌روزرسانی</button>
      </div>
      <div class="hint" id="nStatus" style="margin-top:8px"></div>
      <div class="row" id="nSources" style="margin-top:8px"></div>
    </div>
    <div class="card"><div class="news" id="nList"></div></div>
  </section>

  <!-- ═══ مترجم ═══ -->
  <section id="p-translate" class="panel">
    <div class="card">
      <div class="row">
        <select id="tFrom"></select>
        <span>➜</span>
        <select id="tTo"></select>
        <div class="grow"></div>
        <button class="primary" id="tGo">🌐 ترجمه کن</button>
        <button id="tCopy">📋 کپی</button>
      </div>
      <div class="tr" style="margin-top:12px">
        <textarea id="tText" placeholder="متن را اینجا بنویس…"></textarea>
        <div class="out" id="tOut"><span class="hint">ترجمه اینجا می‌آید…</span></div>
      </div>
      <div class="hint" id="tStatus" style="margin-top:8px">بدون کلید و رایگان — ۱۲ زبان.</div>
    </div>
  </section>
</main>

<footer>MehranAiShabestar — افزودنی‌های رایگان (بدون نیاز به کلید API)</footer>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = (u,o) => fetch(u,o).then(r=>r.json());
let loaded = {weather:false, radio:false, news:false, translate:true};

/* تب‌ها */
document.querySelectorAll(".tab").forEach(t=> t.onclick = ()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
  document.querySelectorAll(".panel").forEach(x=>x.classList.remove("on"));
  t.classList.add("on"); $("#p-"+t.dataset.p).classList.add("on");
  if(location.hash.slice(1)!==t.dataset.p) history.replaceState(null,"","#"+t.dataset.p);
  boot(t.dataset.p);
});
function boot(p){
  if(loaded[p]) return; 
  if(p==="weather") { loaded.weather=true; W($("#wCity").value||"تبریز"); }
  if(p==="radio")   { loaded.radio=true; R(); }
  if(p==="news")    { loaded.news=true; N(); }
}

/* ── هوا ── */
async function W(city){
  $("#wStatus").innerHTML = '<span class="spin"></span> در حال گرفتن هوا…';
  $("#wBox").style.display="none";
  try{
    const d = await api("/api/weather?city="+encodeURIComponent(city));
    if(!d.ok){ $("#wStatus").textContent="⚠️ "+(d.error||"خطا"); return; }
    $("#wStatus").textContent = `به‌روزرسانی: لحظه‌ای پیش — ${d.region}${d.region?"، ":""}${d.country}`;
    const c = d.current;
    $("#wBox").style.display="block";
    $("#wBox").innerHTML = `
      <h3>${esc(d.city)}</h3>
      <div class="now">
        <div class="big">${c.icon}</div>
        <div><div class="t">${c.temp}°</div><div class="hint">${esc(c.desc)}</div></div>
        <div class="hint" style="line-height:2.2">
          🌡 حس‌شده: <b>${c.feels}°</b><br>
          💧 رطوبت: <b>${c.humidity}%</b><br>
          🍃 باد: <b>${c.wind} km/h</b>
        </div>
      </div>
      <div class="days">${(d.days||[]).map(x=>`
        <div class="day"><b>${esc(x.day)}</b>
          <div style="font-size:24px">${x.icon}</div>
          <div><b>${x.max}°</b> <span class="hint">${x.min}°</span></div>
          <div class="hint">${esc(x.desc)}</div>
        </div>`).join("")}</div>`;
  }catch(e){ $("#wStatus").textContent="⚠️ خطای شبکه: "+e.message; }
}
$("#wGo").onclick = ()=>W($("#wCity").value.trim());
$("#wCity").addEventListener("keydown", e=>{ if(e.key==="Enter") W($("#wCity").value.trim()); });
document.querySelectorAll("[data-city]").forEach(b=> b.onclick = ()=>{ $("#wCity").value=b.dataset.city; W(b.dataset.city); });

/* ── رادیو ── */
let CC="", PLAY=null;
async function R(force){
  $("#rStatus").innerHTML = '<span class="spin"></span> در حال گرفتن ایستگاه‌ها…';
  try{
    const q = $("#rQ").value.trim();
    const d = await api(`/api/radio?country=${encodeURIComponent(CC)}&q=${encodeURIComponent(q)}${force?"&refresh=1":""}`);
    if(!d.ok){ $("#rStatus").textContent="⚠️ "+(d.error||"ایستگاهی پیدا نشد"); $("#rList").innerHTML=""; return; }
    $("#rStatus").textContent = `🎧 ${d.count} ایستگاه رایگان — روی «پخش» بزن (فقط خودت پخش می‌کنی)`;
    $("#rList").innerHTML = d.items.map((s,i)=>`
      <div class="st" data-i="${i}">
        ${s.logo?`<img src="${esc(s.logo)}" onerror="this.style.visibility='hidden'">`:`<div style="width:34px;height:34px;border-radius:9px;background:#1b2448;display:flex;align-items:center;justify-content:center">📻</div>`}
        <div class="nm"><div>${esc(s.name)}</div>
          <div class="tg">${esc(s.country_label)} · ${esc(s.codec||"")} ${s.bitrate?`· ${s.bitrate}k`:""} ${s.tags&&s.tags.length?"· "+esc(s.tags.join(" ")):""}</div></div>
        <button class="primary" data-url="${esc(s.url)}" data-name="${esc(s.name)}">▶ پخش</button>
      </div>`).join("");
    $("#rList").querySelectorAll("button[data-url]").forEach(b=> b.onclick = ()=> playStation(b));
  }catch(e){ $("#rStatus").textContent="⚠️ خطای شبکه: "+e.message; }
}
function playStation(b){
  const box=b.closest(".st");
  $("#rList").querySelectorAll(".st").forEach(x=>x.classList.remove("playing"));
  box.classList.add("playing");
  if(PLAY) PLAY.pause();
  PLAY = new Audio(b.dataset.url);
  PLAY.volume = 0.9;
  PLAY.play().then(()=> $("#rStatus").innerHTML=`🔊 در حال پخش: <b>${esc(b.dataset.name)}</b>`)
            .catch(e=> $("#rStatus").innerHTML=`⚠️ پخش نشد (شاید روی گوشی باید یک‌بار دیگر بزنی) — ${esc(e.message)}`);
}
document.querySelectorAll("[data-cc]").forEach(c=> c.onclick = ()=>{
  document.querySelectorAll("[data-cc]").forEach(x=>x.classList.remove("on")); c.classList.add("on");
  CC=c.dataset.cc; R();
});
$("#rGo").onclick = ()=>R(true);
$("#rRe").onclick = ()=>R(true);
$("#rQ").addEventListener("keydown", e=>{ if(e.key==="Enter") R(true); });

/* ── اخبار ── */
async function N(force){
  $("#nStatus").innerHTML = '<span class="spin"></span> در حال گرفتن تیترها…';
  try{
    const d = await api("/api/news"+(force?"?refresh=1":""));
    $("#nSources").innerHTML = (d.sources||[]).map(s=>`<span class="badge ${s.ok?"ok":"no"}" title="${esc(s.error||"")}">${esc(s.source)} ${s.ok?"✓":"✗"}</span>`).join("");
    if(!d.ok){ $("#nStatus").textContent="⚠️ "+(d.error||"خبری نیامد"); return; }
    $("#nStatus").innerHTML = `${d.count} تیتر از ${d.sources_ok.length} خبرگزاری — منبع یابی که در دسترس نبود با ✗ مشخص است.`;
    $("#nList").innerHTML = d.items.slice(0,60).map(n=>`
      <div class="nw"><div class="tt"><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a></div>
        <div class="mt"><span>🗞 ${esc(n.source)}</span><span>🕒 ${ago(n.ts)}</span></div></div>`).join("");
  }catch(e){ $("#nStatus").textContent="⚠️ خطای شبکه: "+e.message; }
}
function ago(ts){
  if(!ts) return "—";
  const s = Math.max(0, (Date.now()/1000)-ts);
  if(s<3600) return Math.round(s/60)+" دقیقه پیش";
  if(s<86400) return Math.round(s/3600)+" ساعت پیش";
  return Math.round(s/86400)+" روز پیش";
}
$("#nRe").onclick = ()=>N(true);

/* ── مترجم ── */
const LANGS=[["fa","فارسی"],["en","انگلیسی"],["ar","عربی"],["tr","ترکی"],["az","آذربایجانی"],["ru","روسی"],["de","آلمانی"],["fr","فرانسوی"],["es","اسپانیایی"],["zh-CN","چینی"],["hi","هندی"],["ku","کردی"]];
$("#tFrom").innerHTML = LANGS.map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
$("#tTo").innerHTML   = LANGS.map(([v,n])=>`<option value="${v}" ${v==="en"?"selected":""}>${n}</option>`).join("");
$("#tGo").onclick = async ()=>{
  const text=$("#tText").value.trim(); if(!text){ $("#tStatus").textContent="اول متن را بنویس."; return; }
  $("#tStatus").innerHTML='<span class="spin"></span> در حال ترجمه…'; $("#tOut").textContent="";
  try{
    const d = await api("/api/translate",{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({text, from:$("#tFrom").value, to:$("#tTo").value})});
    if(!d.ok){ $("#tStatus").textContent="⚠️ "+(d.error||"خطا"); return; }
    $("#tOut").textContent = d.text;
    $("#tStatus").textContent = `✅ ${d.chars} کاراکتر — ${d.engine}`;
  }catch(e){ $("#tStatus").textContent="⚠️ خطای شبکه: "+e.message; }
};
$("#tCopy").onclick = ()=>{ const t=$("#tOut").textContent.trim(); if(!t) return;
  navigator.clipboard.writeText(t).then(()=>$("#tStatus").textContent="📋 کپی شد").catch(()=>{}); };

/* شروع: از هش آدرس یا پیش‌فرض */
const h = location.hash.slice(1);
if(["weather","radio","news","translate"].includes(h)){
  document.querySelectorAll(".tab").forEach(x=>{ if(x.dataset.p===h) x.click(); });
} else { boot("weather"); }
</script>
</body>
</html>
